<!-- Shared pre-login/post-login header -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/css/header-standard.css">
<link rel="stylesheet" href="/css/responsive-standard.css">
<style>
    /* Pre-login dark header override */
    .dashboard-header.prelogin-header {
      background: #1C1917 !important;
      border-bottom-color: rgba(255,255,255,.06) !important;
    }
    .prelogin-header .logo-text {
      color: #F5F0EB !important;
      -webkit-text-fill-color: #F5F0EB !important;
    }
    .prelogin-header .beta-badge {
      background: rgba(180,83,9,.8) !important;
      color: #FEF3C7 !important;
    }
    .prelogin-header .patent-badge {
      color: rgba(245,240,235,.4) !important;
    }
    .prelogin-header .back-link {
      color: rgba(245,240,235,.6) !important;
      border-color: rgba(255,255,255,.1) !important;
      background: transparent !important;
    }
    .prelogin-header .back-link:hover {
      color: #F5F0EB !important;
      border-color: rgba(255,255,255,.2) !important;
      background: rgba(255,255,255,.06) !important;
    }
    .prelogin-header .btn-primary {
      background-color: #B45309 !important;
      color: #fff !important;
      font-weight: 600 !important;
      font-family: 'Bricolage Grotesque', sans-serif !important;
      padding: 6px 14px !important;
      border-radius: 8px !important;
      text-decoration: none !important;
      font-size: 12px !important;
      transition: all 0.2s cubic-bezier(.22,1,.36,1) !important;
      display: inline-flex !important;
      align-items: center !important;
      gap: 5px !important;
      border: none !important;
    }
    .prelogin-header .btn-primary:hover {
      background-color: #D97706 !important;
      transform: translateY(-1px) !important;
    }
    /* Home button — ghost style on dark bg */
    .prelogin-header .btn-home {
      background: transparent !important;
      color: rgba(245,240,235,.6) !important;
      border: 1px solid rgba(255,255,255,.1) !important;
      font-weight: 600 !important;
      font-family: 'Bricolage Grotesque', sans-serif !important;
      padding: 6px 14px !important;
      border-radius: 8px !important;
      text-decoration: none !important;
      font-size: 12px !important;
      display: inline-flex !important;
      align-items: center !important;
      gap: 5px !important;
      transition: all 0.2s !important;
    }
    .prelogin-header .btn-home:hover {
      color: #F5F0EB !important;
      border-color: rgba(255,255,255,.2) !important;
      background: rgba(255,255,255,.06) !important;
    }
    /* Language selector on dark bg */
    .prelogin-header .language-selector .button {
      border-color: rgba(255,255,255,.1) !important;
      color: rgba(245,240,235,.5) !important;
    }
    .prelogin-header .language-selector .button:hover {
      border-color: rgba(255,255,255,.2) !important;
    }
    /* Brand tagline under the logo */
    .logo-block { display: flex; flex-direction: column; justify-content: center; }
    .brand-tagline {
      font-size: 10px;
      font-weight: 600;
      color: #78716C;
      line-height: 1.2;
      margin-top: 1px;
      white-space: nowrap;
      font-family: 'Bricolage Grotesque', sans-serif;
    }
    .prelogin-header .brand-tagline { color: rgba(245,240,235,.55) !important; }
    @media (max-width: 600px) { .brand-tagline { display: none; } }
  </style>

  <header class="dashboard-header prelogin-header">
    <div class="header-container">
      <div class="header-left">
        <div class="logo-block">
          <div class="logo">
            <a href="/" style="display: flex; align-items: center; text-decoration: none; color: inherit;">
              <div class="logo-icon">
                <img src="/images/XcelUP.png" alt="Logo" style="height: 2rem; width: 2rem; border-radius: 8px;" />
              </div>
              <span class="logo-text">XcelUP</span>
            </a>
            <!-- <span class="beta-badge">BETA</span> -->
            <span class="patent-badge">Patent Pending</span>
          </div>
          <span class="brand-tagline">Innovation is no longer the bottleneck. Adoption is.&trade;</span>
        </div>
      </div>

      <div class="header-right">
          <a href="/" class="btn-home"><i class="fa fa-home" aria-hidden="true"></i> Home</a>
          <!-- <a href="/login" class="btn-primary"><i class="fa fa-sign-in"></i> Login</a> -->
          <a href="/contact" class="btn-primary" style="background-color:#059669 !important;">Request a Demo</a>

        <div class="language-selector">
          <form action="/change-language" method="post">
            <div class="dropdown">
              <input type="checkbox" id="langToggle" class="toggle">
              <label for="langToggle" class="button">
                <img src="https://w1.pngwing.com/pngs/101/401/png-transparent-language-icon-circle-pictogram-black-and-white-line-symbol-logo-emblem.png" alt="" class="button-logo-rotate">
                <img src="https://flagcdn.com/w20/us.png" alt="" class="selected-flag">
              </label>
              <div class="menu">
                <button type="submit" name="lang" value="en" class="selected"><img src="https://flagcdn.com/w20/us.png" class="flag-icon"> English (US)</button>
                <button type="submit" name="lang" value="us" class=""><img src="https://flagcdn.com/w20/gb.png" class="flag-icon"> English</button>
                <button type="submit" name="lang" value="hi" class=""><img src="https://flagcdn.com/w20/in.png" class="flag-icon"> हिंदी</button>
                <button type="submit" name="lang" value="fr" class=""><img src="https://flagcdn.com/w20/fr.png" class="flag-icon"> Français</button>
                <button type="submit" name="lang" value="swi" class=""><img src="https://flagcdn.com/w20/se.png" class="flag-icon"> Swedish</button>
                <button type="submit" name="lang" value="de" class=""><img src="https://flagcdn.com/w20/de.png" class="flag-icon"> Deutsch</button>
                <button type="submit" name="lang" value="es" class=""><img src="https://flagcdn.com/w20/es.png" class="flag-icon"> Español</button>
                <button type="submit" name="lang" value="el" class=""><img src="https://flagcdn.com/w20/gr.png" class="flag-icon"> Ελληνικά</button>
                <button type="submit" name="lang" value="ar" class=""><img src="https://flagcdn.com/w20/sa.png" class="flag-icon"> العربية</button>
                <button type="submit" name="lang" value="id" class=""><img src="https://flagcdn.com/w20/id.png" class="flag-icon"> Bahasa Indonesia</button>
                <button type="submit" name="lang" value="vi" class=""><img src="https://flagcdn.com/w20/vn.png" class="flag-icon"> Tiếng Việt</button>
                <button type="submit" name="lang" value="zh" class=""><img src="https://flagcdn.com/w20/cn.png" class="flag-icon"> 中文</button>
                <button type="submit" name="lang" value="ru" class=""><img src="https://flagcdn.com/w20/ru.png" class="flag-icon"> Русский</button>
                <button type="submit" name="lang" value="ko" class=""><img src="https://flagcdn.com/w20/kr.png" class="flag-icon"> 한국어</button>
                <button type="submit" name="lang" value="tr" class=""><img src="https://flagcdn.com/w20/tr.png" class="flag-icon"> Türkçe</button>
                <button type="submit" name="lang" value="pt" class=""><img src="https://flagcdn.com/w20/pt.png" class="flag-icon"> Português</button>
                <button type="submit" name="lang" value="ja" class=""><img src="https://flagcdn.com/w20/jp.png" class="flag-icon"> 日本語</button>
                <button type="submit" name="lang" value="it" class=""><img src="https://flagcdn.com/w20/it.png" class="flag-icon"> Italiano</button>
                <button type="submit" name="lang" value="pl" class=""><img src="https://flagcdn.com/w20/pl.png" class="flag-icon"> Polski</button>
                <button type="submit" name="lang" value="ga" class=""><img src="https://flagcdn.com/w20/ie.png" class="flag-icon"> Gaeilge</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </header>
  <script>
  (function(){
    document.addEventListener('click',function(e){
      document.querySelectorAll('.language-selector .toggle').forEach(function(cb){
        if(cb.checked && !cb.closest('.language-selector').contains(e.target)){
          cb.checked=false;
        }
      });
    });
  })();
  </script>
